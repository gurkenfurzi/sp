<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studia Recovery</title>
<style>
html,body{height:100%;margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff7f4;color:#6d5650}
main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(520px,100%);background:#fff;border:1px solid #ead7d1;border-radius:24px;padding:24px;box-shadow:0 16px 45px rgba(101,73,64,.09)}
h1{font-size:26px;margin:0 0 8px}.muted{color:#9a8178;line-height:1.5}.status{margin:18px 0;padding:12px 14px;border-radius:14px;background:#fff4f1;font-weight:800}button{width:100%;min-height:48px;border:0;border-radius:14px;background:#e8a0a4;color:white;font:800 15px inherit;cursor:pointer}
</style>
</head>
<body><main><div class="card"><h1>Studia reparieren</h1><div class="muted">Diese Seite löscht nur alte Studia-App-Caches und Service Worker. Deine gespeicherten Studia-Daten in localStorage werden nicht gelöscht.</div><div id="status" class="status">Bereite Reparatur vor …</div><button id="go">Studia öffnen</button></div></main>
<script>
(async()=>{
  const s=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>/^studia-shell-/i.test(k)).map(k=>caches.delete(k)));
    }
    s.textContent='Fertig. Alte App-Caches wurden entfernt.';
  }catch(e){
    s.textContent='Cache-Bereinigung übersprungen. Studia kann trotzdem geöffnet werden.';
  }
  document.getElementById('go').onclick=()=>location.replace('./index.html?rollback=160');
})();
</script></body></html>
